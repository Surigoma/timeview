version: '3'

vars:
  NPM: '{{if eq OS "windows"}}npm.cmd{{else}}npm{{end}}'

tasks:
  default:
    cmds: [task --list]
  setup:
    desc: Install locked development dependencies
    cmds:
      - go mod download
      - '{{.NPM}} --prefix web ci'
  dev:backend:
    desc: Start Go API on 127.0.0.1:8080
    cmds:
      - task: web:build
      - go run -tags=nomsgpack -buildvcs=false . {{.CLI_ARGS}}
  dev:frontend:
    desc: Start Vite (API and SSE proxy to Go)
    dir: web
    cmds: ['{{.NPM}} run dev -- {{.CLI_ARGS}}']
  dev:remote:
    desc: Run the headless remote CLI
    env:
      CGO_ENABLED: '1'
    cmds: ['go run -buildvcs=false ./cmd/timeview-remote {{.CLI_ARGS}}']
  fmt:
    desc: Format Go and frontend source
    cmds:
      - gofmt -w main.go internal cmd web/embed.go
      - '{{.NPM}} --prefix web run fmt'
  lint:
    desc: Check Go, TypeScript and ESLint
    env:
      CGO_ENABLED: '0'
    cmds:
      - task: web:build
      - go vet -tags=nomsgpack . ./cmd/... ./internal/... ./web
      - '{{.NPM}} --prefix web run lint'
  test:
    desc: Run backend and frontend tests
    env:
      CGO_ENABLED: '0'
    cmds:
      - task: web:build
      - go test -tags=nomsgpack . ./cmd/... ./internal/... ./web
      - '{{.NPM}} --prefix web test'
  web:build:
    internal: true
    dir: web
    cmds: ['{{.NPM}} run build']
  build:
    desc: Build a standalone executable for this OS/CPU
    cmds:
      - task: web:build
      - task: binary
        vars: { TARGET_OS: '{{OS}}', TARGET_ARCH: '{{ARCH}}' }
      - task: remote:build
  docker:build:
    desc: Build the lightweight TimeView container image
    cmds:
      - docker build --tag timeview:local .
  docker:up:
    desc: Build and start TimeView with persistent Docker storage
    cmds:
      - docker compose up --build
  binary:
    internal: true
    env:
      CGO_ENABLED: '0'
      GOOS: '{{.TARGET_OS}}'
      GOARCH: '{{.TARGET_ARCH}}'
    cmds:
      - go build -tags=nomsgpack -buildvcs=false -trimpath -ldflags="-s -w" -o dist/{{.TARGET_OS}}-{{.TARGET_ARCH}}/timeview{{if eq .TARGET_OS "windows"}}.exe{{end}} .
  remote:build:
    desc: Build the headless remote CLI for this OS/CPU (requires a C/C++ toolchain)
    env:
      CGO_ENABLED: '1'
    cmds:
      - go build -buildvcs=false -trimpath -ldflags='-s -w{{if eq OS "windows"}} -linkmode external -extldflags "-static"{{end}}' -o dist/{{OS}}-{{ARCH}}/timeview-remote{{if eq OS "windows"}}.exe{{end}} ./cmd/timeview-remote
  release:
    desc: Build release executables for this OS/CPU (CI builds all 5 targets)
    cmds:
      - task: build
  release:tag:
    desc: Validate, create vVERSION tag and push it to trigger a GitHub release
    requires:
      vars: [VERSION]
    cmds:
      - git diff --exit-code
      - git diff --cached --exit-code
      - task lint
      - task test
      - git tag --annotate "v{{.VERSION}}" --message "v{{.VERSION}}"
      - git push origin "v{{.VERSION}}"
