name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run lint
      - run: npm --prefix web test
      - run: npm --prefix web run build
      - run: go vet -tags=nomsgpack . ./cmd/... ./internal/... ./web
      - run: go test -tags=nomsgpack -cover ./internal/...
      - run: go test -tags=nomsgpack . ./web
      - run: go test ./cmd/...
      - run: docker build --tag timeview:ci .

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release staging/windows-amd64 staging/darwin-amd64 staging/darwin-arm64 staging/linux-amd64 staging/linux-arm64
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -tags=nomsgpack -buildvcs=false -trimpath -ldflags="-s -w" -o staging/windows-amd64/timeview.exe .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags="-s -w" -o staging/windows-amd64/timeview-remote.exe ./cmd/timeview-remote
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -tags=nomsgpack -buildvcs=false -trimpath -ldflags="-s -w" -o staging/darwin-amd64/timeview .
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags="-s -w" -o staging/darwin-amd64/timeview-remote ./cmd/timeview-remote
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -tags=nomsgpack -buildvcs=false -trimpath -ldflags="-s -w" -o staging/darwin-arm64/timeview .
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -buildvcs=false -trimpath -ldflags="-s -w" -o staging/darwin-arm64/timeview-remote ./cmd/timeview-remote
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags=nomsgpack -buildvcs=false -trimpath -ldflags="-s -w" -o staging/linux-amd64/timeview .
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags="-s -w" -o staging/linux-amd64/timeview-remote ./cmd/timeview-remote
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -tags=nomsgpack -buildvcs=false -trimpath -ldflags="-s -w" -o staging/linux-arm64/timeview .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -buildvcs=false -trimpath -ldflags="-s -w" -o staging/linux-arm64/timeview-remote ./cmd/timeview-remote
          zip -j "release/timeview_${GITHUB_REF_NAME}_windows_amd64.zip" staging/windows-amd64/timeview.exe staging/windows-amd64/timeview-remote.exe
          tar -czf "release/timeview_${GITHUB_REF_NAME}_darwin_amd64.tar.gz" -C staging/darwin-amd64 timeview timeview-remote
          tar -czf "release/timeview_${GITHUB_REF_NAME}_darwin_arm64.tar.gz" -C staging/darwin-arm64 timeview timeview-remote
          tar -czf "release/timeview_${GITHUB_REF_NAME}_linux_amd64.tar.gz" -C staging/linux-amd64 timeview timeview-remote
          tar -czf "release/timeview_${GITHUB_REF_NAME}_linux_arm64.tar.gz" -C staging/linux-arm64 timeview timeview-remote
          cd release
          sha256sum timeview_* > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
