name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run lint
      - run: npm --prefix web test
      - run: npm --prefix web run build
      - run: go vet -tags=nomsgpack . ./cmd/... ./internal/... ./web
      - run: go test -tags=nomsgpack -cover ./internal/...
      - run: go test -tags=nomsgpack . ./web
      - run: go test ./cmd/...
      - run: docker build --tag timeview:ci .

  native-build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-amd64
            runner: windows-latest
            goos: windows
            goarch: amd64
            extension: .exe
          - target: darwin-amd64
            runner: macos-15-intel
            goos: darwin
            goarch: amd64
            extension: ''
          - target: darwin-arm64
            runner: macos-15
            goos: darwin
            goarch: arm64
            extension: ''
          - target: linux-amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            extension: ''
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            extension: ''
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - name: Install Linux input headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxtst-dev libx11-xcb-dev libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev
      - name: Build native executables
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            export PATH="/c/msys64/ucrt64/bin:/c/msys64/mingw64/bin:${PATH}"
            command -v gcc
            command -v g++
            remote_ldflags='-s -w -linkmode external -extldflags "-static"'
          else
            remote_ldflags='-s -w'
          fi
          mkdir -p "staging/${{ matrix.target }}"
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -tags=nomsgpack -buildvcs=false -trimpath -ldflags="-s -w" -o "staging/${{ matrix.target }}/timeview${{ matrix.extension }}" .
          CGO_ENABLED=1 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go vet ./cmd/timeview-remote
          CGO_ENABLED=1 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -buildvcs=false -trimpath -ldflags="${remote_ldflags}" -o "staging/${{ matrix.target }}/timeview-remote${{ matrix.extension }}" ./cmd/timeview-remote
      - name: Package Windows release
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "staging/${{ matrix.target }}/*" -DestinationPath "timeview_${{ github.ref_name }}_${{ matrix.target }}.zip"
      - name: Package Unix release
        if: startsWith(github.ref, 'refs/tags/v') && runner.os != 'Windows'
        shell: bash
        run: tar -czf "timeview_${{ github.ref_name }}_${{ matrix.target }}.tar.gz" -C "staging/${{ matrix.target }}" timeview timeview-remote
      - uses: actions/upload-artifact@v6
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: ${{ matrix.target }}
          path: timeview_${{ github.ref_name }}_*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: native-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Create checksums
        working-directory: release
        run: sha256sum timeview_* > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
